<button onclick="launchXbox()" style="padding: 15px 30px; background-color: #107c11; color: white; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; font-family: sans-serif;">
    🎮 Launch Xbox App Mode
</button>

<script>
function launchXbox() {
    // Configure window dimensions
    const width = 1280;
    const height = 720;
    
    // Center the window on your computer monitor
    const left = (screen.width - width) / 2;
    const top = (screen.height - height) / 2;
    
    // 'popup=yes' hides the browser tabs, search bar, and bookmarks
    window.open(
        "https://xbox.com", 
        "XboxCloudGaming", 
        `popup=yes,width=${width},height=${height},top=${top},left=${left},resizable=yes,scrollbars=yes`
    );
}
</script>
